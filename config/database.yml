# MySQL Database Configuration (via Trilogy adapter)
#
default: &default
  adapter: trilogy
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("MYSQL_USER") { "root" } %>
  password: <%= ENV.fetch("MYSQL_PASSWORD") { "" } %>
  host: <%= ENV.fetch("MYSQL_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("MYSQL_PORT") { 3306 } %>

development:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE") { "book_library_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE_TEST") { "book_library_test" } %>

production:
  primary: &production_primary
    <<: *default
    database: <%= ENV.fetch("MYSQL_DATABASE") { "book_library_production" } %>
    username: <%= ENV.fetch("BOOK_LIBRARY_DATABASE_USERNAME") { ENV.fetch("MYSQL_USER") { "root" } } %>
    password: <%= ENV.fetch("BOOK_LIBRARY_DATABASE_PASSWORD") { ENV.fetch("MYSQL_PASSWORD") { "" } } %>
    host: <%= ENV.fetch("BOOK_LIBRARY_DATABASE_HOST") { ENV.fetch("MYSQL_HOST") { "127.0.0.1" } } %>
    port: <%= ENV.fetch("BOOK_LIBRARY_DATABASE_PORT") { ENV.fetch("MYSQL_PORT") { 3306 } } %>
  cache:
    <<: *production_primary
    database: <%= ENV.fetch("MYSQL_DATABASE_CACHE") { "book_library_production_cache" } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_primary
    database: <%= ENV.fetch("MYSQL_DATABASE_QUEUE") { "book_library_production_queue" } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_primary
    database: <%= ENV.fetch("MYSQL_DATABASE_CABLE") { "book_library_production_cable" } %>
    migrations_paths: db/cable_migrate
